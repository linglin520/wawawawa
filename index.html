<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="点一下，wawawawa。" />
    <title>wawawawa</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23000'/%3E%3Ctext x='32' y='45' text-anchor='middle' fill='%23fff' font-family='Arial,sans-serif' font-size='40' font-weight='900'%3Ew%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <section class="intro" id="intro" tabindex="0" aria-label="点击空白处开始，或按回车键开始">
      <div class="intro-main">
        <img class="intro-sticker" src="./assets/cutout-01.svg" alt="wawawawa 表情包" width="208" height="208" draggable="false" />
        <p class="start-prompt">Touch to Start</p>
      </div>
      <aside class="community" aria-label="白金档案查分群广告">
        <div class="community-visual"><img class="community-art" src="./assets/platina-banner.png" alt="" width="1200" height="480" /></div>
        <div class="community-copy">
          <p class="community-label">PLATiNA :: LAB</p>
          <h1>白金档案查分群</h1>
          <div class="community-contact"><span class="group-number">590457282</span><button id="copy-group" type="button">复制群号</button></div>
          <span class="sr-only" id="copy-status" role="status"></span>
        </div>
      </aside>
    </section>
    <main class="scene" id="scene" hidden>
      <div class="ghosts" id="ghosts" aria-hidden="true"></div>
      <button class="sticker-button" type="button" aria-label="播放 wawawawa">
        <img id="sticker" src="./assets/cutout-01.svg" alt="" width="208" height="208" draggable="false" />
        <img class="sticker-open" src="./assets/cutout-03.svg" alt="" width="208" height="208" draggable="false" aria-hidden="true" />
      </button>
      <span class="sr-only" id="status" role="status">点击、触屏或按任意键播放</span>
    </main>
    <audio id="voice" src="./assets/wawa.mp3" preload="auto"></audio>
  </body>
</html>
